openapi: 3.0.3
info:
  title: DeFarm Check API
  description: "

    Multi-country socio-environmental compliance verification API.


    **Supported Countries:**

    - 🇧🇷 Brazil (CNPJ, CPF, CAR, Coordinates)

    - 🇺🇾 Uruguay (RUC, CI, Coordinates)


    **Features:**

    - Public and monitored data sources (Lista Suja, CGU, IBAMA, CAR, PRODES,
    DETER, INPE fire hotspots, ANA, MAPA, protected areas)

    - PostGIS spatial queries for deforestation/protected areas

    - Real-time and cached results

    - Comprehensive compliance scoring


    **Data Sources:**

    - Environmental: CAR, PRODES, DETER, INPE Fire Hotspots, ANA Water Permits,
    IBAMA, SNAP

    - Social: Lista Suja MTE, CGU Sanctions

    - Legal: CAR, DICOSE, Organic Producers

    - Positive: MAPA Organics

    \        "
  version: 1.0.0
  contact:
    name: DeFarm API Support
    url: https://defarm.net
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication. Contact support to obtain a key.
  schemas:
    Country:
      type: string
      enum:
        - BR
        - UY
      description: ISO 3166-1 alpha-2 country code
    InputType:
      type: string
      enum:
        - CNPJ
        - CPF
        - CAR
        - IE
        - RUC
        - CI
        - COORDINATES
        - ADDRESS
        - NAME
      description: "

        Input type for compliance check:

        - **CNPJ**: Brazilian company tax ID (14 digits) - Brazil only

        - **CPF**: Brazilian individual tax ID (11 digits) - Brazil only

        - **CAR**: Brazilian rural environmental registry - Brazil only

        - **IE**: Brazilian state registration - Brazil only

        - **RUC**: Uruguayan tax ID (12 digits) - Uruguay only

        - **CI**: Uruguayan national ID (7-8 digits) - Uruguay only

        - **COORDINATES**: Geographic coordinates (universal)

        - **ADDRESS**: Physical address (universal)

        - **NAME**: Company/producer name (universal)

        \            "
    CheckInput:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: "#/components/schemas/InputType"
        value:
          oneOf:
            - type: string
              description: Document number or address
            - type: object
              required:
                - lat
                - lon
              properties:
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lon:
                  type: number
                  minimum: -180
                  maximum: 180
              description: Coordinates for COORDINATES type
        country:
          $ref: "#/components/schemas/Country"
          description: Country code (optional, auto-detected from input type)
    CheckRequest:
      type: object
      required:
        - input
      properties:
        input:
          $ref: "#/components/schemas/CheckInput"
        options:
          type: object
          properties:
            sources:
              type: array
              items:
                type: string
              description: "Specific sources to check (default: all applicable)"
              example:
                - Slave Labor Registry
                - SNAP Protected Areas
            useCache:
              type: boolean
              default: true
              description: Use cached results if available
            includeEvidence:
              type: boolean
              default: true
              description: Include evidence/source data in response
    CheckResponse:
      type: object
      properties:
        checkId:
          type: string
          format: uuid
        input:
          $ref: "#/components/schemas/CheckInput"
        timestamp:
          type: string
          format: date-time
        verdict:
          type: string
          enum:
            - PASS
            - FAIL
            - WARNING
            - ERROR
          description: Overall compliance verdict
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Compliance score (0-100)
        sources:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              category:
                type: string
                enum:
                  - environmental
                  - social
                  - legal
                  - positive
              status:
                type: string
                enum:
                  - PASS
                  - FAIL
                  - WARNING
                  - ERROR
                  - NOT_APPLICABLE
              severity:
                type: string
                enum:
                  - LOW
                  - MEDIUM
                  - HIGH
                  - CRITICAL
              message:
                type: string
              cached:
                type: boolean
        summary:
          type: object
        metadata:
          type: object
          properties:
            processingTimeMs:
              type: integer
            cacheHitRate:
              type: number
            apiVersion:
              type: string
paths:
  /health:
    get:
      summary: Health check
      tags:
        - health
      description: >-
        Returns the operational status of all services, plus data source
        freshness.


        **Status values:**

        - `ok`: Database and cache dependencies are healthy

        - `degraded`: Reserved for partial infrastructure issues

        - `down`: Database or Redis is unavailable


        Data freshness is reported separately under `dataQuality` and
        `dataSources` so uptime monitors do not treat stale datasets as an API
        outage.


        **Data freshness thresholds:**

        - DETER: fresh < 48h, stale > 96h (daily updates)

        - IBAMA: fresh < 168h, stale > 336h (weekly updates)

        - Lista Suja: fresh < 720h, stale > 1440h (monthly updates)

        - PRODES: annual release cadence, monitored with annual thresholds
      parameters:
        - schema:
            type: boolean
            default: false
          in: query
          name: includeHidden
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                      - down
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 1.0.0
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        enum:
                          - ok
                          - down
                        example: ok
                      redis:
                        type: string
                        enum:
                          - ok
                          - down
                          - disabled
                        example: ok
                  dataSources:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: PRODES Deforestation
                        category:
                          type: string
                          nullable: true
                          example: environmental
                        lastUpdated:
                          type: string
                          format: date-time
                          nullable: true
                        hoursSinceUpdate:
                          type: integer
                          nullable: true
                          example: 48
                        freshnessStatus:
                          type: string
                          enum:
                            - fresh
                            - warning
                            - stale
                            - never_updated
                            - unknown
                          example: fresh
                        healthImpact:
                          type: string
                          enum:
                            - critical
                            - data_quality
                            - advisory
                          example: data_quality
                        staleAffectsOperationalStatus:
                          type: boolean
                          example: false
                        publicVisible:
                          type: boolean
                          example: true
                        visibilityReason:
                          type: string
                          nullable: true
                        totalRecords:
                          type: integer
                          nullable: true
                          example: 216252
                        recordCountSource:
                          type: string
                          enum:
                            - table
                            - metadata
                            - unknown
                          example: table
                        dataSourceUrl:
                          type: string
                          nullable: true
                  tableCounts:
                    type: object
                    nullable: true
                    properties:
                      lista_suja:
                        type: integer
                        example: 678
                      cgu_sancoes:
                        type: integer
                        example: 10000
                      ibama_embargoes:
                        type: integer
                        example: 65953
                      deter_alerts:
                        type: integer
                        example: 1200
                      terras_indigenas:
                        type: integer
                        example: 740
                      unidades_conservacao:
                        type: integer
                        example: 334
                      prodes_deforestation:
                        type: integer
                        example: 216252
                      car_registrations:
                        type: integer
                        example: 3544068
                      car_registrations_hot:
                        type: integer
                        example: 3544068
                      queimadas_focos:
                        type: integer
                        example: 120000
                      mapa_organicos:
                        type: integer
                        example: 10000
                      mapbiomas_alerta:
                        type: integer
                        example: 35447
                      ana_outorgas:
                        type: integer
                        example: 48179
                  l3Status:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - fresh
                          - stale
                          - never_generated
                          - unknown
                      lastGeneratedAt:
                        type: string
                        format: date-time
                        nullable: true
                      hoursSinceGeneration:
                        type: integer
                        nullable: true
                  dataQuality:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - fresh
                          - warning
                          - degraded
                          - unknown
                      staleSources:
                        type: array
                        items:
                          type: string
                      warningSources:
                        type: array
                        items:
                          type: string
                      neverUpdatedSources:
                        type: array
                        items:
                          type: string
                      unknownFreshnessSources:
                        type: array
                        items:
                          type: string
                      generatedAt:
                        type: string
                        format: date-time
                  operationalNotes:
                    type: object
                    properties:
                      degradedMeansDataQualityIssue:
                        type: boolean
                      dataFreshnessAffectsHealth:
                        type: boolean
                      workerContinuousMode:
                        type: string
                      publicAccess:
                        type: string
        "503":
          description: Service unavailable — database or Redis is down
          content:
            application/json:
              schema:
                type: object
                description: Service unavailable — database or Redis is down
                properties:
                  status:
                    type: string
                    enum:
                      - down
                      - degraded
                    example: down
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        enum:
                          - ok
                          - down
                        example: down
                      redis:
                        type: string
                        enum:
                          - ok
                          - down
                          - disabled
                        example: down
  /check:
    post:
      summary: Execute compliance check
      tags:
        - check
      description: >-
        Run a socio-environmental compliance verification against all applicable
        data sources.


        **Brazil examples:**

        - CNPJ: `{"input":{"type":"CNPJ","value":"12345678000190"}}`

        - CPF: `{"input":{"type":"CPF","value":"12345678901"}}`

        - CAR: `{"input":{"type":"CAR","value":"MT-5100250-XXXXXXXXXXXXXXXX"}}`

        - Coordinates:
        `{"input":{"type":"COORDINATES","value":{"lat":-9.3748,"lon":-68.2104}}}`


        **Uruguay examples:**

        - RUC: `{"input":{"type":"RUC","value":"210000000001","country":"UY"}}`

        - CI: `{"input":{"type":"CI","value":"12345678","country":"UY"}}`

        - Coordinates:
        `{"input":{"type":"COORDINATES","value":{"lat":-34.4711,"lon":-56.1945},"country":"UY"}}`


        **Verdicts:**

        - `PASS` (score 80-100): No violations found

        - `WARNING` (score 50-79): Minor issues or data gaps

        - `FAIL` (score 0-49): Violations detected

        - `ERROR`: Check failed to execute
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - input
              properties:
                input:
                  type: object
                  required:
                    - type
                    - value
                  properties:
                    type:
                      type: string
                      enum:
                        - CNPJ
                        - CPF
                        - CAR
                        - IE
                        - RUC
                        - CI
                        - CUIT
                        - CUIL
                        - RUC_PY
                        - CI_PY
                        - NIT_BO
                        - CI_BO
                        - RUT
                        - NIT_CO
                        - CC_CO
                        - RUC_PE
                        - DNI_PE
                        - COORDINATES
                        - ADDRESS
                        - NAME
                        - POLYGON
                    value:
                      oneOf:
                        - type: string
                        - type: object
                    country:
                      type: string
                      enum:
                        - BR
                        - UY
                        - AR
                        - PY
                        - BO
                        - CL
                        - CO
                        - PE
                        - ID
                        - MY
                        - VN
                        - TH
                        - CI
                        - GH
                        - CM
                        - NG
                        - "*"
                options:
                  type: object
                  properties:
                    sources:
                      type: array
                      items:
                        type: string
                    useCache:
                      type: boolean
                    includeEvidence:
                      type: boolean
                    timeout:
                      type: number
        required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkId:
                    type: string
                  input:
                    type: object
                    properties:
                      type:
                        type: string
                      value: {}
                  timestamp:
                    type: string
                  verdict:
                    type: string
                  score:
                    type: number
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        category:
                          type: string
                        sourceType:
                          type: string
                          enum:
                            - direct
                            - derived
                        status:
                          type: string
                        severity:
                          type: string
                        message:
                          type: string
                        details:
                          type: object
                          additionalProperties: true
                        indicators:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              value: {}
                              unit:
                                type: string
                              direction:
                                type: string
                                enum:
                                  - HIGHER_IS_WORSE
                                  - LOWER_IS_WORSE
                                  - NEUTRAL
                              confidence:
                                type: number
                              source:
                                type: string
                        evidence:
                          type: object
                          properties:
                            dataSource:
                              type: string
                            url:
                              type: string
                            lastUpdate:
                              type: string
                            raw: {}
                        executionTimeMs:
                          type: number
                        cached:
                          type: boolean
                  summary:
                    type: object
                    properties:
                      totalCheckers:
                        type: number
                      passed:
                        type: number
                      failed:
                        type: number
                      warnings:
                        type: number
                      errors:
                        type: number
                      notApplicable:
                        type: number
                  insights:
                    type: object
                    properties:
                      l2:
                        type: object
                        properties:
                          version:
                            type: string
                          dimensions:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                label:
                                  type: string
                                score:
                                  type: number
                                weight:
                                  type: number
                                rationale:
                                  type: string
                      l3:
                        type: object
                        properties:
                          version:
                            type: string
                          signals:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                label:
                                  type: string
                                value: {}
                                horizon:
                                  type: string
                                  enum:
                                    - 7d
                                    - 30d
                                    - 90d
                                confidence:
                                  type: number
                  metadata:
                    type: object
                    properties:
                      processingTimeMs:
                        type: number
                      cacheHitRate:
                        type: number
                      apiVersion:
                        type: string
                      timestamp:
                        type: string
                      dataQuality:
                        type: object
                        description: Operational data freshness summary. A degraded data-quality status
                          means one or more source datasets are stale; it is not
                          the same as a compliance violation.
                        properties:
                          status:
                            type: string
                            enum:
                              - fresh
                              - warning
                              - degraded
                              - unknown
                          staleSources:
                            type: array
                            items:
                              type: string
                          warningSources:
                            type: array
                            items:
                              type: string
                          neverUpdatedSources:
                            type: array
                            items:
                              type: string
                          unknownFreshnessSources:
                            type: array
                            items:
                              type: string
                          generatedAt:
                            type: string
                            format: date-time
  /checks/{id}:
    get:
      summary: Get check result by ID
      tags:
        - check
      description: Retrieve a previously executed compliance check result by its UUID.
        Check results are persisted after each `POST /check` call.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /report.html:
    post:
      responses:
        "200":
          description: Default Response
  /report:
    get:
      responses:
        "200":
          description: Default Response
  /sources:
    get:
      summary: List all data sources
      tags:
        - sources
      description: Returns all registered compliance checkers with their category,
        status, and description. Useful for discovering which data sources are
        active and what input types they support.
      parameters:
        - schema:
            type: boolean
            default: false
          in: query
          name: includeHidden
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    category:
                      type: string
                    enabled:
                      type: boolean
                    status:
                      type: string
                    description:
                      type: string
                    supportedInputTypes:
                      type: array
                      items:
                        type: string
                    supportedCountries:
                      type: array
                      items:
                        type: string
                    priority:
                      type: integer
                    freshness:
                      type: object
                      nullable: true
                      properties:
                        name:
                          type: string
                        category:
                          type: string
                          nullable: true
                        lastUpdated:
                          type: string
                          format: date-time
                          nullable: true
                        hoursSinceUpdate:
                          type: integer
                          nullable: true
                        freshnessStatus:
                          type: string
                          enum:
                            - fresh
                            - warning
                            - stale
                            - never_updated
                            - unknown
                        healthImpact:
                          type: string
                          enum:
                            - critical
                            - data_quality
                            - advisory
                        staleAffectsOperationalStatus:
                          type: boolean
                        publicVisible:
                          type: boolean
                        visibilityReason:
                          type: string
                          nullable: true
                        totalRecords:
                          type: integer
                          nullable: true
                        recordCountSource:
                          type: string
                          enum:
                            - table
                            - metadata
                            - unknown
                        dataSourceUrl:
                          type: string
                          nullable: true
  /sources/{category}:
    get:
      summary: List sources by category
      tags:
        - sources
      description: "Filter checkers by category. Valid categories: `environmental`
        (deforestation, protected areas), `social` (slave labor, sanctions),
        `legal` (CAR, livestock registry)."
      parameters:
        - schema:
            type: boolean
            default: false
          in: query
          name: includeHidden
          required: false
        - schema:
            type: string
            enum:
              - environmental
              - social
              - legal
          in: path
          name: category
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    category:
                      type: string
                    enabled:
                      type: boolean
                    status:
                      type: string
                    description:
                      type: string
                    supportedInputTypes:
                      type: array
                      items:
                        type: string
                    supportedCountries:
                      type: array
                      items:
                        type: string
                    priority:
                      type: integer
                    freshness:
                      type: object
                      nullable: true
                      properties:
                        name:
                          type: string
                        category:
                          type: string
                          nullable: true
                        lastUpdated:
                          type: string
                          format: date-time
                          nullable: true
                        hoursSinceUpdate:
                          type: integer
                          nullable: true
                        freshnessStatus:
                          type: string
                          enum:
                            - fresh
                            - warning
                            - stale
                            - never_updated
                            - unknown
                        healthImpact:
                          type: string
                          enum:
                            - critical
                            - data_quality
                            - advisory
                        staleAffectsOperationalStatus:
                          type: boolean
                        publicVisible:
                          type: boolean
                        visibilityReason:
                          type: string
                          nullable: true
                        totalRecords:
                          type: integer
                          nullable: true
                        recordCountSource:
                          type: string
                          enum:
                            - table
                            - metadata
                            - unknown
                        dataSourceUrl:
                          type: string
                          nullable: true
  /samples/lista-suja:
    get:
      summary: "Sample: Slave Labor Registry (Lista Suja)"
      tags:
        - samples
      description: >-
        Returns up to 10 random CPF/CNPJ records currently listed in the **Lista
        Suja do Trabalho Escravo** (MTE Slave Labor Registry).


        Use these documents to verify that the `/check` endpoint correctly flags
        them as **FAIL** for slave labor violations.


        Each sample includes a `testUrl` field with the exact request body to
        copy into `POST /check`.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    example: Lista Suja do Trabalho Escravo (MTE)
                  count:
                    type: integer
                    example: 10
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        document:
                          type: string
                          description: CPF or CNPJ (digits only)
                          example: "12345678000190"
                        documentFormatted:
                          type: string
                          description: Formatted document
                          example: 12.345.678/0001-90
                        name:
                          type: string
                          description: Employer/company name
                          example: Fazenda Exemplo Ltda
                        type:
                          type: string
                          enum:
                            - CPF
                            - CNPJ
                          example: CNPJ
                        state:
                          type: string
                          example: PA
                        year:
                          type: integer
                          example: 2023
                        workersAffected:
                          type: integer
                          example: 12
                        testUrl:
                          type: string
                          example: POST /check {"input":{"type":"CNPJ","value":"12345678000190"}}
  /samples/ibama:
    get:
      summary: "Sample: IBAMA Environmental Embargoes"
      tags:
        - samples
      description: >-
        Returns up to 10 CPF/CNPJ records with active **IBAMA environmental
        embargoes**, sorted by embargo count (most embargoes first).


        Use these documents to verify that the `/check` endpoint correctly flags
        them as **FAIL** for IBAMA violations.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    example: IBAMA Embargoes
                  count:
                    type: integer
                    example: 10
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        document:
                          type: string
                          description: CPF or CNPJ (digits only)
                          example: "98765432000199"
                        type:
                          type: string
                          enum:
                            - CPF
                            - CNPJ
                          example: CNPJ
                        name:
                          type: string
                          example: Madeireira Fictícia SA
                        embargoCount:
                          type: integer
                          description: Number of active embargoes
                          example: 3
                        totalAreaHa:
                          type: number
                          description: Total embargoed area in hectares
                          example: 1250.5
                        testUrl:
                          type: string
  /samples/cgu-sancoes:
    get:
      summary: "Sample: CGU Sanctions (CEIS, CNEP, CEAF)"
      tags:
        - samples
      description: >-
        Returns up to 10 CPF/CNPJ records with **active CGU sanctions** from the
        Federal Transparency Portal registers:

        - **CEIS** — Companies/individuals ineligible for federal contracts

        - **CNEP** — National register of punished companies

        - **CEAF** — Administrative misconduct


        Use these documents to test the CGU Sanctions checker.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    example: CGU - Sanções (CEIS, CNEP, CEAF)
                  count:
                    type: integer
                    example: 10
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        document:
                          type: string
                          example: "11222333000181"
                        documentFormatted:
                          type: string
                          example: 11.222.333/0001-81
                        name:
                          type: string
                          example: Empresa Sancionada Ltda
                        type:
                          type: string
                          enum:
                            - CPF
                            - CNPJ
                          example: CNPJ
                        sanctionType:
                          type: string
                          example: CEIS
                        category:
                          type: string
                          example: Inidoneidade
                        status:
                          type: string
                          example: ATIVO
                        startDate:
                          type: string
                          format: date
                          example: 2022-05-01
