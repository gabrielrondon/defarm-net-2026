  /samples/car:
    get:
      summary: "Sample: CAR with irregular status (cancelled/suspended)"
      tags:
        - samples
      description: >-
        Returns up to 10 CAR (Cadastro Ambiental Rural) registrations with
        **irregular status** — cancelled (CA), suspended (SU), or pending (PE).


        Use the `carNumber` to test the CAR checker via `POST /check` with
        `"type":"CAR"`, which checks for irregular status and potential PRODES
        deforestation overlap.


        **Status codes:**

        - `CA` — Cancelado (Cancelled): registration was annulled

        - `SU` — Suspenso (Suspended): temporarily suspended

        - `PE` — Pendente (Pending): awaiting regularization

        - `AT` — Ativo (Active): regular status
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    example: CAR - Cadastro Ambiental Rural (SICAR)
                  count:
                    type: integer
                    example: 10
                  message:
                    type: string
                    nullable: true
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        carNumber:
                          type: string
                          description: CAR registration number
                          example: MT-5100250-XXXXXXXXXXXXXXXX
                        status:
                          type: string
                          enum:
                            - CA
                            - SU
                            - PE
                            - AT
                          example: CA
                        statusDescription:
                          type: string
                          example: CANCELADO
                        areaHa:
                          type: number
                          example: 120.5
                        municipality:
                          type: string
                          example: Sinop
                        state:
                          type: string
                          example: MT
                        coordinates:
