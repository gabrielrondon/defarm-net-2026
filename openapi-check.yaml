                    type: object
                    nullable: true
                    additionalProperties: true
                    description: Lista Suja sample (Brazil)
                  ibama:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: IBAMA embargo sample (Brazil)
                  ie:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: Inscrição Estadual sample (Brazil)
                  terrasIndigenas:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: Indigenous land coordinates (Brazil)
                  unidadesConservacao:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: Conservation unit coordinates (Brazil)
                  deter:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: DETER real-time alert coordinates (Brazil)
                  car:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: Irregular CAR registration (Brazil)
                  prodes:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: PRODES deforestation coordinates (Brazil)
                  snap:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: SNAP protected area coordinates (Uruguay)
                  dicose:
