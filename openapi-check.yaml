  /samples/dicose:
    get:
      summary: "Sample: DICOSE livestock registry (Uruguay)"
      tags:
        - samples
      description: >-
        Returns up to 10 Uruguayan producer documents (RUC or CI) with **DICOSE
        declarations** from the last 2 years.


        DICOSE (Declaración Jurada de Existencias de Ganado) is Uruguay's
        official livestock census managed by MGAP. It registers all livestock
        establishments and their bovine, ovine, and equine counts.


        Producers appearing in DICOSE are considered **registered/compliant** —
        this is a **positive** indicator. Missing declarations may indicate
        non-compliance.


        **Document types:**

        - **RUC** — Registro Único de Contribuyentes (12 digits):
        company/corporate tax ID

        - **CI** — Cédula de Identidad (7–8 digits): individual national ID


        **Example request:**

        ```json

        POST /check

        {
          "input": {
            "type": "RUC",
            "value": "210000000001",
            "country": "UY"
          }
        }

        ```
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    example: DICOSE - Rural/Livestock Registry (Uruguay)
                  country:
                    type: string
                    example: UY
                  count:
                    type: integer
                    example: 10
                  message:
                    type: string
                    nullable: true
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        document:
                          type: string
                          description: RUC (12 digits) or CI (7-8 digits)
                          example: "210000000001"
                        documentType:
                          type: string
                          enum:
                            - RUC
                            - CI
                          example: RUC
                        producerName:
                          type: string
                          nullable: true
                          example: Estancia El Ombú
                        establishmentId:
                          type: string
                          nullable: true
                          description: DICOSE establishment identifier
                          example: D-12345
                        year:
                          type: integer
                          example: 2024
                        areaHa:
                          type: number
                          nullable: true
                          description: Declared land area in hectares
                          example: 850
                        department:
                          type: string
                          nullable: true
                          example: Tacuarembó
                        section:
                          type: string
                          nullable: true
                          description: Cadastral section
                          example: "3"
                        activity:
                          type: string
                          nullable: true
                          example: Ganadería
                        livestockSummary:
                          type: string
                          description: Summary of declared livestock
                          example: 500 bovinos, 200 ovinos
                        declarationStatus:
                          type: string
                          nullable: true
                          example: PRESENTADA
                        testUrl:
                          type: string
                          example: POST /check
                            {"input":{"type":"RUC","value":"210000000001","country":"UY"}}
